id = "kimi"
version = "2026.08.21.1"
min_engine_version = 1
updated_at = "2026-08-21T00:00:00Z"
aliases = ["kimi-code", "kimi code"]

# The envelope this agent puts under every one of its events. It names the event
# in the payload itself, so nothing has to be told which hook it is reading, and
# it spells the session and the working directory the way the agents that write
# in snake case do.
[payload]
event = "hook_event_name"
session = ["session_id"]
cwd = ["cwd"]

# The wrapper installed for this agent is registered for a dozen events; this
# file describes the one that says which session is running. The rest arrive at
# nothing, which is what an event no mapping describes gets everywhere, and
# growing this file is how they start being understood — nothing about the
# installation has to change for that.
[[events]]
name = "SessionStart"
kind = "session_start"

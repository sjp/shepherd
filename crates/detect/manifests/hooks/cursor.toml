id = "cursor"
version = "2026.08.21.1"
min_engine_version = 1
updated_at = "2026-08-21T00:00:00Z"
aliases = ["cursor-agent", "cursor agent"]

# The one agent here that spells the event beginning a session in lower camel
# case; the name below is the agent's own and not the one the others share.
#
# Two spellings of the session are accepted because this agent's payload carries
# both: the conversation it belongs to, and the session itself. The session is
# asked for first, being the narrower of the two.
#
# No working directory is read. This agent reports where it is working as a list
# of roots rather than as one directory, and a field naming a list is not a field
# this dialect can take a directory out of. A payload that names none simply
# reports no directory, which is the honest answer here.
#
# Every field below is taken from this agent's published hook reference rather
# than from a payload captured off a running session, which is a weaker thing to
# rest on: a field that turns out to be spelled differently reports nothing at
# all rather than reporting wrongly, but it still reports nothing.
[payload]
event = "hook_event_name"
session = ["session_id", "conversation_id"]

[[events]]
name = "sessionStart"
kind = "session_start"

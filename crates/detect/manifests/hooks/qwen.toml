id = "qwen"
version = "2026.08.21.1"
min_engine_version = 1
updated_at = "2026-08-21T00:00:00Z"
aliases = ["qwen-code", "qwen code"]

# One event is hooked for this agent, and what it is wanted for is the identity
# of the session that has just started. The field names below follow the shape
# this agent's event names come from and are the ones its own hook scripts read.
[payload]
event = "hook_event_name"
session = ["session_id"]
cwd = ["cwd"]

# This agent says why a session began — started, resumed, cleared, compacted,
# branched — in a field of its own, and that travels beside the event: a session
# a receiver has already seen, arriving again because it was resumed, is a
# different thing from one it has never heard of.
[[events]]
name = "SessionStart"
kind = "session_start"
detail = [{ field = "source", from = "source" }]

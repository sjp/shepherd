# _agentbus — this file was generated by `agentbus install` and is removed by
# `agentbus uninstall`. Both of them look for this line: a file of this name
# without it is somebody's own and is never touched, so a copy you want to keep
# is a copy you rename.
#
# AGENTBUS_HOOK_VERSION=1
#
# What the agent reads to find out what the directory beside this file is. The
# name below is also the name of that directory and the name the plugin is
# switched on by in the agent's own `config.yaml`; all three have to say the
# same thing, or the entry in that file names nothing.
name: agentbus
version: "1.0"
description: Reports session identity to the agent event bus

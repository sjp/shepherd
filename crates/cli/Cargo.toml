[package]
name = "agentbus-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "agentbus_cli"
path = "src/lib.rs"

[[bin]]
name = "agentbus"
path = "src/main.rs"

[dependencies]
agentbus-daemon = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

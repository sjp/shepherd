[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/daemon",
    "crates/install",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
agentbus-protocol = { path = "crates/protocol" }
agentbus-daemon = { path = "crates/daemon" }
agentbus-install = { path = "crates/install" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
rustls-graviola = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
socket2 = "0.6"
tempfile = "3"
thiserror = "2"
tiny_http = "0.12"
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/detect",
    "crates/daemon",
    "crates/install",
    "crates/cli",
    "crates/shepherd-core",
    "crates/shepherd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
agentbus-protocol = { path = "crates/protocol" }
agentbus-detect = { path = "crates/detect" }
agentbus-daemon = { path = "crates/daemon" }
agentbus-install = { path = "crates/install" }
shepherd-core = { path = "crates/shepherd-core" }

alacritty_terminal = "0.26"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
gpui = "0.2"
gpui-component = "0.5"
# Pinned exactly: its concrete-syntax-tree API is what lets a file somebody
# maintains by hand be edited without reformatting the rest of it, and a
# change in how that tree renders would change files on users' machines.
jsonc-parser = { version = "=0.33.1", default-features = false, features = ["cst", "serde_json"] }
libc = "0.2"
regex = "1"
rustls-graviola = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
socket2 = "0.6"
tempfile = "3"
thiserror = "2"
tiny_http = "0.12"
tokio = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
